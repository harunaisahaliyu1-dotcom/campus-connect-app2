<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Connect - BIG App 2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#F2F5F2;color:#0A2E1F}
a{color:#0A2E1F}.top{position:sticky;top:0;z-index:10;background:#0A2E1F;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:22px}.logo span{color:#C6F16D}.pill{background:#C6F16D;color:#0A2E1F;border:0;padding:8px 12px;border-radius:999px;font-weight:800;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.hero{background:#0A2E1F;color:#fff;border-radius:20px;padding:22px}.hero h1{margin:6px 0;font-size:30px}.hero p{opacity:.9}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{padding:10px 14px;border-radius:999px;border:1px solid #D6E2D6;background:#fff;cursor:pointer;font-weight:700}
.tab.active{background:#0A2E1F;color:#fff}.tab.admin{background:#FFD700}
input,select,textarea{width:100%;padding:12px;border:1px solid #D6E2D6;border-radius:12px;margin:6px 0;font-size:15px}
button{cursor:pointer}.btn{background:#0A2E1F;color:#fff;border:0;padding:12px 16px;border-radius:999px;font-weight:800}
.btn-lime{background:#C6F16D;color:#0A2E1F}.btn-red{background:#C0392B;color:#fff}.btn-gold{background:#FFD700;color:#0A2E1F}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
.person{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:#0A2E1F;color:#C6F16D;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.small{font-size:13px;opacity:.75}.badge{background:#EAF7D6;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
.chat-b{max-width:80%;padding:10px 12px;border-radius:14px;margin:6px 0}.me{background:#C6F16D;margin-left:auto}.them{background:#EFEFEF}
.hidden{display:none}.center{text-align:center}.owner{border:3px solid #FFD700}.danger{background:#FFF0F0;border:1px solid #FFC9C9}
.check{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid #eee;border-radius:12px;margin:6px 0}
.stat{background:#0A2E1F;color:#fff;border-radius:16px;padding:14px}.stat b{font-size:26px}
</style></head>
<body>
<div id="authScreen" class="wrap">
<div class="card center"><div style="font-size:48px">🎓</div><h1 style="font-size:32px;margin:6px">campus<span style="color:#7CB342">connect</span></h1><p><b>YOUR ACADEMIC COMMUNITY</b><br>Come on in.<br>Sign in or create your student account to connect, learn and grow.</p>
<div id="authBox"></div>
<p class="small">Founder / Super Admin is protected. Only
